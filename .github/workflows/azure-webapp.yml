name: Build and deploy to Azure Web App

# Deploys the FastAPI app (REST API + bundled web UI) to Azure App Service.
#
# Setup (one time):
#   1. In the Azure portal, open your Web App -> "Get publish profile" and copy
#      the downloaded XML.
#   2. In GitHub: Settings -> Secrets and variables -> Actions -> New repository
#      secret named AZURE_WEBAPP_PUBLISH_PROFILE, and paste the XML.
#   3. Make sure the App Service runtime stack is "Python 3.11" (Linux).
#
# The build job installs deps and runs the test suite; deploy only runs if the
# build (and tests) pass. Azure's Oryx builder installs requirements.txt on the
# server, and the startup command below serves the app with Gunicorn + Uvicorn
# workers.

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: thavalon-py
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - name: Package application for deployment
        # Exclude local/dev artifacts; Azure builds dependencies from requirements.txt.
        run: |
          zip -r release.zip . \
            -x '.git/*' '.github/*' '.venv/*' '**/__pycache__/*' \
               '.pytest_cache/*' '.ruff_cache/*' 'tests/*' '*.egg-info/*'

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip -o release.zip

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          startup-command: "gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120"
